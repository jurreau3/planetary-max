name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-21"

[vars]
PORTAL_OS_PHASE = "11"
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"
IDENTITY_JWT_ISSUER = "portal-login"
IDENTITY_JWT_AUDIENCE = "planetary-max"
MAX_OS_VERSION = "1"

[durable_objects]
bindings = [
  { name = "PORTAL_KERNEL", class_name = "PortalKernel" }
]

[[migrations]]
tag = "v1"
new_classes = ["PortalKernel"]

[[kv_namespaces]]
binding = "MAXOS_STATE"
id = "d2f70f669d0a4a499e7262a7cc2a56d2"

[[services]]
binding = "MAX_OS_1"
service = "max-os-1"
environment = "production"
