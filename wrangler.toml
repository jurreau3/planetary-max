name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2026-09-17"

[vars]
IDENTITY_JWT_ISSUER = "portal-login"
IDENTITY_JWT_AUDIENCE = "planetary-max"
PORTAL_OS_PHASE = "11"
KERNEL_TIMEOUT_MS = "5000"
SUBSTRATE_TIMEOUT_MS = "3000"
PLANETARY_MODE = "active"
MAX_OS_VERSION = "1"
UMBRELLA_ENFORCEMENT = "strict"
MAX_RETRY_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "50"
CIRCUIT_FAILURE_THRESHOLD = "5"
CIRCUIT_COOLDOWN_MS = "30000"

[durable_objects]
bindings = [
  { name = "PORTAL_KERNEL", class_name = "PortalKernel" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortalKernel"]

[[kv_namespaces]]
binding = "MAXOS_STATE"
id = "maxos_state"

[[services]]
binding = "MAX_OS_1"
service = "max-os-1"

[build]
command = "npm run build"
