name = "planetary-max"
main = "dist/index.js"
compatibility_date = "2024-09-21"

[vars]
PORTAL_OS_PHASE = "11"
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"
IDENTITY_JWT_ISSUER = "portal-login"
IDENTITY_JWT_AUDIENCE = "planetary-max"
MAX_OS_VERSION = "1"

[durable_objects]
bindings = [
  { name = "PORTAL_KERNEL", class_name = "PortalKernel" }
]

[[kv_namespaces]]
binding = "MAXOS_STATE"
id = "<KV_NAMESPACE_ID>"
